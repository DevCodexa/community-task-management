name: Build and test applications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check frontend TypeScript
        run: npm run typecheck
      - run: npm run test:notifications
      - run: npm run build
      - run: node --test tests/supabase-config.test.mjs
      - run: node --test tests/event-staff.test.mjs
      - run: node --test tests/event-delete-ui.test.mjs
      - run: node --test tests/task-mutations.test.mjs
      - run: node --test tests/task-delete-ui.test.mjs
      - run: node --test tests/private-community-rls.test.mjs
      - run: node --test tests/self-profile-rls.test.mjs
      - run: node --test tests/self-profile-ui.test.mjs

  email-worker:
    name: Email worker tests and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
      - name: Audit worker production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Build email worker image
        run: docker build --tag email-worker-ci .
