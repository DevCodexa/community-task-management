# Render configuration for the Email Worker.
# Use this as a starting point; adjust image/instance values per Render dashboard.

services:
  - type: worker
    name: email-worker
    env: global
    plan: free
    buildCommand: "docker build -t email-worker ."
    startCommand: "node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: SUPABASE_URL
        from: "SUPABASE_URL"
      - key: SUPABASE_SERVICE_ROLE_KEY
        from: "SUPABASE_SERVICE_ROLE_KEY"

# NOTE:
# Brevo credentials are loaded from Supabase table `email_settings`,
# so no Brevo env vars are required.

